[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-agent"
version = "0.1.0"
description = "Local synthetic-data agent learning project — Phase 0 bootstrap"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0,<2",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
financial-agent = "financial_agent.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not integration and not live'"
markers = [
    "integration: full 2,000-user generation and database validation",
    "live: tests that call a real external data service",
]
