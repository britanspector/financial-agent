<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>Financial Agent Console</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <svg class="svg-sprite" aria-hidden="true">
    <symbol id="icon-terminal" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m7 9 3 3-3 3M13 15h4"/></symbol>
    <symbol id="icon-send" viewBox="0 0 24 24"><path d="m21 3-8 18-2.7-7.3L3 11l18-8Z"/><path d="m10.3 13.7 4.8-4.8"/></symbol>
    <symbol id="icon-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="11" height="11" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></symbol>
    <symbol id="icon-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5M14 11v5"/></symbol>
    <symbol id="icon-code" viewBox="0 0 24 24"><path d="m8 9-3 3 3 3M16 9l3 3-3 3M14 5l-4 14"/></symbol>
    <symbol id="icon-x" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="icon-refresh" viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M7 8a7 7 0 0 1 11.5-1.5L20 8M4 16l1.5 1.5A7 7 0 0 0 17 16"/></symbol>
  </svg>

  <div class="app-shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">FA</span><strong>Financial Agent</strong><span>&#24320;&#21457;&#25511;&#21046;&#21488;</span></div>
      <div class="runtime-meta">
        <span><i id="connectionDot"></i><b id="connectionLabel">&#27491;&#22312;&#36830;&#25509;</b></span>
        <span id="modelLabel">&mdash;</span><span>evaluation</span>
      </div>
    </header>

    <aside class="session-panel" aria-label="&#24403;&#21069;&#20250;&#35805;">
      <div class="section-heading">&#24403;&#21069;&#20250;&#35805;</div>
      <div class="session-summary">
        <strong id="sessionTitle">&#26032;&#20250;&#35805;</strong>
        <dl>
          <div><dt>&#23545;&#35805;&#36718;&#25968;</dt><dd id="turnCount">0</dd></div>
          <div><dt>&#26368;&#36817; Run</dt><dd id="currentRunId">&mdash;</dd></div>
          <div><dt>&#36816;&#34892;&#29366;&#24577;</dt><dd id="sessionStatus">&#24453;&#21629;</dd></div>
        </dl>
      </div>
      <p class="session-note">&#24403;&#21069;&#29256;&#26412;&#20165;&#20445;&#30041;&#19968;&#20010;&#26412;&#22320;&#20250;&#35805;&#65292;&#21047;&#26032;&#21518;&#20250;&#24674;&#22797;&#23545;&#35805;&#20869;&#23481;&#12290;</p>
      <button class="secondary-button clear-button" id="clearConversation" type="button"><svg><use href="#icon-trash"/></svg>&#28165;&#31354;&#24403;&#21069;&#20250;&#35805;</button>
    </aside>

    <main class="conversation">
      <header class="conversation-header">
        <div><span class="kicker">CONVERSATION</span><h1>Agent &#23545;&#35805;</h1></div>
        <span class="run-state" id="conversationRunState">&#31561;&#24453;&#36755;&#20837;</span>
      </header>
      <section class="message-stream" id="messageStream" aria-live="polite"></section>
      <div class="composer-wrap">
        <form class="composer" id="composerForm">
          <textarea id="queryInput" rows="2" placeholder="&#36755;&#20837;&#38382;&#39064;&#12290;Enter &#21457;&#36865;&#65292;Shift + Enter &#25442;&#34892;&#12290;" required></textarea>
          <div class="composer-footer">
            <span id="historyHint">&#23558;&#25658;&#24102; 0 &#26465;&#21382;&#21490;&#28040;&#24687;</span>
            <button class="send-button" id="sendButton" type="submit"><span>&#21457;&#36865;</span><svg><use href="#icon-send"/></svg></button>
          </div>
        </form>
      </div>
    </main>

    <aside class="run-panel" aria-label="&#36816;&#34892;&#35814;&#24773;">
      <header class="run-panel-header">
        <div><span class="kicker">TRACE</span><h2>&#36816;&#34892;&#35814;&#24773;</h2></div>
        <button class="secondary-button raw-trace-button" id="rawTraceButton" type="button" disabled><svg><use href="#icon-code"/></svg>&#21407;&#22987;&#36861;&#36394;</button>
      </header>
      <div class="run-summary" id="runSummary"><span class="status-indicator idle"></span><div><strong>&#23578;&#26410;&#36816;&#34892;</strong><small>&#21457;&#36865;&#38382;&#39064;&#21518;&#65292;&#36825;&#37324;&#20250;&#26174;&#31034;&#23436;&#25972;&#25191;&#34892;&#36807;&#31243;&#12290;</small></div></div>
      <div class="run-timeline" id="runTimeline"><div class="empty-panel"><svg><use href="#icon-terminal"/></svg><p>Planner&#12289;Tool&#12289;Writer &#21644; Verifier &#30340;&#36755;&#20837;&#36755;&#20986;&#23558;&#25353;&#36718;&#27425;&#26174;&#31034;&#12290;</p></div></div>
    </aside>
  </div>

  <dialog id="rawTraceDialog">
    <header><div><span class="kicker">RAW JSON</span><h2>&#21407;&#22987;&#36861;&#36394;</h2></div><button class="icon-button" id="closeRawTrace" type="button" aria-label="&#20851;&#38381;"><svg><use href="#icon-x"/></svg></button></header>
    <pre id="rawTraceContent"></pre>
    <footer><span id="rawTraceMeta">&mdash;</span><button class="secondary-button" id="copyRawTrace" type="button"><svg><use href="#icon-copy"/></svg>&#22797;&#21046; JSON</button></footer>
  </dialog>
  <div class="toast" id="toast" role="status"></div>
  <script src="./app.js"></script>
</body>
</html>
